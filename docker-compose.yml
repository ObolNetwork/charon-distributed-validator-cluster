x-node-base:
  # Pegged charon version: latest gloas branch commit (needed for the Sepolia Gloas fork).
  &node-base
  image: obolnetwork/charon:${CHARON_VERSION:-13d5d92}
  restart: unless-stopped
  networks: [cluster]
  depends_on: [relay]
  volumes:
    - ./.charon:/opt/charon/.charon/

x-node-env: &node-env
  CHARON_BEACON_NODE_ENDPOINTS: ${CHARON_BEACON_NODE_ENDPOINTS:-http://lighthouse:5052}
  CHARON_BEACON_NODE_HEADERS: ${CHARON_BEACON_NODE_HEADERS:-IgnoredHTTP=header}
  CHARON_LOG_LEVEL: ${CHARON_LOG_LEVEL:-info}
  CHARON_LOG_FORMAT: ${CHARON_LOG_FORMAT:-console}
  CHARON_P2P_EXTERNAL_HOSTNAME: ${CHARON_P2P_EXTERNAL_HOSTNAME:-} # Empty default required to avoid warnings.
  CHARON_P2P_RELAYS: ${CHARON_P2P_RELAYS:-http://relay:3640/enr}
  CHARON_P2P_TCP_ADDRESS: ${CHARON_P2P_TCP_ADDRESS:-0.0.0.0:3610}
  CHARON_VALIDATOR_API_ADDRESS: ${CHARON_VALIDATOR_API_ADDRESS:-0.0.0.0:3600}
  CHARON_MONITORING_ADDRESS: ${CHARON_MONITORING_ADDRESS:-0.0.0.0:3620}
  CHARON_NICKNAME: ${CHARON_NICKNAME:-}
  CHARON_BUILDER_API: ${BUILDER_API_ENABLED:-true}

services:
  #             _   _                         _           _
  #  _ __   ___| |_| |__   ___ _ __ _ __ ___ (_)_ __   __| |
  # | '_ \ / _ \ __| '_ \ / _ \ '__| '_ ` _ \| | '_ \ / _` |
  # | | | |  __/ |_| | | |  __/ |  | | | | | | | | | | (_| |
  # |_| |_|\___|\__|_| |_|\___|_|  |_| |_| |_|_|_| |_|\__,_|
  nethermind:
    image: nethermind/nethermind:${NETHERMIND_VERSION:-2.1.0}
    restart: unless-stopped
    ports:
      - ${NETHERMIND_PORT_P2P:-30303}:30303/tcp # P2P TCP
      - ${NETHERMIND_PORT_P2P:-30303}:30303/udp # P2P UDP
      - ${NETHERMIND_PORT_HTTP:-8545}:8545 # JSON-RPC
      - ${NETHERMIND_PORT_ENGINE:-8551}:8551 # ENGINE-API
    command: |
      --config=${ETH2_NETWORK}
      --datadir=data
      --HealthChecks.Enabled=true
      --JsonRpc.Enabled=true
      --JsonRpc.JwtSecretFile="/root/jwt/jwt.hex"
      --JsonRpc.EngineHost=0.0.0.0
      --JsonRpc.EnginePort=8551
      --JsonRpc.Host=0.0.0.0
      --JsonRpc.Port=8545
      --Sync.SnapSync=true
      --Sync.SnapServingEnabled=false
      --Blocks.PreWarming=Block
      --History.Pruning=Rolling
    networks: [cluster]
    volumes:
      - ./data/nethermind:/nethermind/data
      - ./jwt:/root/jwt

  #  _ _       _     _   _
  # | (_) __ _| |__ | |_| |__   ___  _   _ ___  ___
  # | | |/ _` | '_ \| __| '_ \ / _ \| | | / __|/ _ \
  # | | | (_| | | | | |_| | | | (_) | |_| \__ \  __/
  # |_|_|\__, |_| |_|\__|_| |_|\___/ \__,_|___/\___|
  #      |___/

  lighthouse:
    image: sigp/lighthouse:${LIGHTHOUSE_VERSION:-v8.3.0-rc.0}
    ports:
      - ${LIGHTHOUSE_PORT_P2P:-9000}:9000/tcp # P2P TCP
      - ${LIGHTHOUSE_PORT_P2P:-9000}:9000/udp # P2P UDP
      - ${LIGHTHOUSE_PORT_HTTP:-5052}:5052 # HTTP API
      - ${LIGHTHOUSE_PORT_METRICS:-5054}:5054 # Metrics
    command: |
      lighthouse bn
      --network=${ETH2_NETWORK}
      --checkpoint-sync-url=${LIGHTHOUSE_CHECKPOINT_SYNC_URL:-https://checkpoint-sync.${ETH2_NETWORK}.ethpandaops.io/}
      --execution-endpoint=${LIGHTHOUSE_EXECUTION_ENDPOINT:-http://nethermind:8551}
      --execution-jwt=/opt/jwt/jwt.hex
      --builder=${LIGHTHOUSE_BUILDER_URL:-http://mev-boost:18550}
      --datadir=/opt/app/beacon/
      --debug-level=info
      --http
      --http-address=0.0.0.0
      --http-port=5052
      --metrics
      --metrics-address=0.0.0.0
      --metrics-port=5054
      --metrics-allow-origin="*"
    networks: [cluster]
    volumes:
      - ./data/lighthouse:/opt/app/beacon
      - ./jwt:/opt/jwt
    restart: unless-stopped

  #                             _                     _
  #   _ __ ___   _____   __    | |__   ___   ___  ___| |_
  #  | '_ ` _ \ / _ \ \ / /____| '_ \ / _ \ / _ \/ __| __|
  #  | | | | | |  __/\ V /_____| |_) | (_) | (_) \__ \ |_
  #  |_| |_| |_|\___| \_/      |_.__/ \___/ \___/|___/\__|
  mev-boost:
    image: flashbots/mev-boost:${MEV_BOOST_VERSION:-1.12}
    command: |
      -${ETH2_NETWORK}
      -loglevel=info
      -addr=0.0.0.0:18550
      -relay-check
      -relays=${MEV_RELAYS}
      -request-timeout-getheader=${MEV_TIMEOUT_GETHEADER:-950}
      -request-timeout-getpayload=${MEV_TIMEOUT_GETPAYLOAD:-4000}
      -request-timeout-regval=${MEV_TIMEOUT_REGVAL:-3000}
      -metrics
      -metrics-addr=0.0.0.0:18551
    networks: [cluster]
    restart: unless-stopped

  #       _                                  _ _            _
  #   ___| |__   __ _ _ __ ___  _ __     ___| (_) ___ _ __ | |_ ___
  #  / __| '_ \ / _` | '__/ _ \| '_ \   / __| | |/ _ \ '_ \| __/ __|
  # | (__| | | | (_| | | | (_) | | | | | (__| | |  __/ | | | |_\__ \
  #  \___|_| |_|\__,_|_|  \___/|_| |_|  \___|_|_|\___|_| |_|\__|___/
  node0:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node0/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node0/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node0

  node1:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node1/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node1/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node1

  node2:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node2/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node2/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node2

  node3:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node3/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node3/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node3

  node4:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node4/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node4/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node4

  node5:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node5/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node5/cluster-lock.json
      CHARON_P2P_EXTERNAL_HOSTNAME: node5

  relay:
    <<: *node-base
    command: relay
    depends_on: []
    environment:
      <<: *node-env
      CHARON_HTTP_ADDRESS: 0.0.0.0:3640
      CHARON_DATA_DIR: /opt/charon/relay
      CHARON_P2P_RELAYS: ""
      CHARON_P2P_EXTERNAL_HOSTNAME: relay
    volumes:
      - ./relay:/opt/charon/relay:rw

  #             _ _     _       _
  # __   ____ _| (_) __| | __ _| |_ ___  _ __ ___
  # \ \ / / _` | | |/ _` |/ _` | __/ _ \| '__/ __|
  #  \ V / (_| | | | (_| | (_| | || (_) | |  \__ \
  #   \_/ \__,_|_|_|\__,_|\__,_|\__\___/|_|  |___/
  vc0-lighthouse:
    image: sigp/lighthouse:${LIGHTHOUSE_VERSION:-v8.3.0-rc.0}
    entrypoint: /opt/lighthouse/run.sh
    networks: [cluster]
    depends_on: [node0]
    restart: unless-stopped
    environment:
      LIGHTHOUSE_BEACON_NODE_ADDRESS: http://node0:3600
      ETH2_NETWORK: ${ETH2_NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    volumes:
      - ./lighthouse/run.sh:/opt/lighthouse/run.sh
      - .charon/cluster/node0/validator_keys:/opt/charon/keys
      - .charon/cluster/node0:/opt/charon/node:ro
      - ./data/vc0-lighthouse:/root/.lighthouse

  vc1-teku:
    # Note: Teku (26.9.1) always requests the stateful (payload-excluded) form of gloas block
    # production and has no option to request the stateless form, which a distributed validator
    # needs, so it cannot propose gloas blocks behind charon today.
    build:
      context: teku
      args:
        VERSION: ${TEKU_VERSION:-26.9.1}
    image: cdvc-teku:${TEKU_VERSION:-26.9.1}
    # Starts as root so run.sh can hand ./data/vc1-teku to uid 1000; Teku itself runs as uid 1000.
    user: root
    entrypoint: /opt/charon/teku/run.sh
    networks: [cluster]
    depends_on: [node1]
    restart: unless-stopped
    environment:
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    command: |
      validator-client
      --beacon-node-api-endpoint="http://node1:3600"
      --config-file "/opt/charon/teku/teku-config.yaml"
      --data-base-path=/home/data
      --validators-proposer-default-fee-recipient=${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
      --validators-builder-registration-default-enabled=${BUILDER_API_ENABLED:-true}
    volumes:
      - .charon/cluster/node1/validator_keys:/opt/charon/validator_keys
      - .charon/cluster/node1:/opt/charon/node:ro
      - ./teku:/opt/charon/teku
      - ./data/vc1-teku:/home/data

  vc2-nimbus:
    build: nimbus
    # Keep the tag in sync with nimbus/Dockerfile: compose only builds an image it doesn't have yet.
    image: cdvc-nimbus:v26.10.0
    # Starts as root so run.sh can hand ./data/vc2-nimbus to uid 1000; Nimbus itself runs as uid 1000.
    user: root
    entrypoint: /home/user/run.sh
    networks: [cluster]
    depends_on: [node2]
    restart: unless-stopped
    environment:
      NODE: node2
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    volumes:
      - .charon/cluster/node2/validator_keys:/home/validator_keys
      - .charon/cluster/node2:/opt/charon/node:ro
      - ./nimbus/run.sh:/home/user/run.sh
      - ./data/vc2-nimbus:/home/user/data

  vc3-lodestar:
    image: chainsafe/lodestar:${LODESTAR_VERSION:-v1.49.0}
    entrypoint: /opt/lodestar/run.sh
    networks: [cluster]
    depends_on: [node3]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node3:3600
      NETWORK: ${ETH2_NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      BUILDER_SELECTION: ${LODESTAR_BUILDER_SELECTION:-builderalways}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    volumes:
      - ./lodestar/run.sh:/opt/lodestar/run.sh
      - .charon/cluster/node3/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node3:/opt/charon/node:ro
      - ./data/vc3-lodestar:/opt/data

  vc4-prysm:
    build:
      context: prysm
      args:
        VERSION: ${PRYSM_VERSION:-v7.2.0}
    image: cdvc-prysm:${PRYSM_VERSION:-v7.2.0}
    platform: "linux/amd64"
    entrypoint: /home/prysm/run.sh
    networks: [cluster]
    depends_on: [node4]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node4:3600
      NETWORK: ${ETH2_NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    volumes:
      - ./prysm/run.sh:/home/prysm/run.sh
      - .charon/cluster/node4/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node4:/opt/charon/node:ro
      - ./data/vc4-prysm:/data/vc

  vc5-lodestar:
    image: chainsafe/lodestar:${LODESTAR_VERSION:-v1.49.0}
    entrypoint: /opt/lodestar/run.sh
    networks: [cluster]
    depends_on: [node5]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node5:3600
      NETWORK: ${ETH2_NETWORK}
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      BUILDER_SELECTION: ${LODESTAR_BUILDER_SELECTION:-builderalways}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    volumes:
      - ./lodestar/run.sh:/opt/lodestar/run.sh
      - .charon/cluster/node5/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node5:/opt/charon/node:ro
      - ./data/vc5-lodestar:/opt/data

  #                        _ _             _
  #  _ __ ___   ___  _ __ (_) |_ ___  _ __(_)_ __   __ _
  # | '_ ` _ \ / _ \| '_ \| | __/ _ \| '__| | '_ \ / _` |
  # | | | | | | (_) | | | | | || (_) | |  | | | | | (_| |
  # |_| |_| |_|\___/|_| |_|_|\__\___/|_|  |_|_| |_|\__, |
  #                                                |___/
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    # Runs as root so run.sh can write the rendered prometheus.yml into the bind-mounted dir.
    user: ":"
    ports:
      - "9090:9090"
    networks: [cluster]
    environment:
      # Obol hosted-monitoring token, rendered into prometheus.yml by run.sh; never tracked.
      PROM_REMOTE_WRITE_TOKEN: ${PROM_REMOTE_WRITE_TOKEN}
    volumes:
      - ./prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    entrypoint: /etc/prometheus/run.sh

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    ports:
      - "3000:3000"
    networks: [cluster]
    depends_on: [prometheus]
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/datasource.yml
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/dashboards:/etc/dashboards

networks:
  cluster:

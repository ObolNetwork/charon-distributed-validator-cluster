x-node-base:
  # Pegged charon version (update this for each release).
  &node-base
  image: obolnetwork/charon:${CHARON_VERSION:-2efb57e} # latest gloas
  restart: unless-stopped
  networks: [cluster]
  depends_on: [relay]
  volumes:
    - ./.charon:/opt/charon/.charon/

x-node-env: &node-env
  CHARON_BEACON_NODE_ENDPOINTS: ${CHARON_BEACON_NODE_ENDPOINTS:-http://lighthouse:5052}
  # Fallback beacon nodes are used only when the primaries are offline or unhealthy.
  CHARON_FALLBACK_BEACON_NODE_ENDPOINTS: ${CHARON_FALLBACK_BEACON_NODE_ENDPOINTS:-}
  # Per-request beacon node timeout. Raise (e.g. 5s) when the primary is a remote
  # BN; a timeout on a slow-but-healthy remote call otherwise falls back.
  CHARON_BEACON_NODE_TIMEOUT: ${CHARON_BEACON_NODE_TIMEOUT:-2s}
  # Go runtime debug settings. Set GODEBUG=http2client=0 to force HTTP/1.1 to the
  # beacon node when it sits behind a CDN edge (e.g. Cloudflare): Go's default
  # HTTP/2 client intermittently hangs requests there until the request deadline.
  GODEBUG: ${GODEBUG:-}
  CHARON_BEACON_NODE_HEADERS: ${CHARON_BEACON_NODE_HEADERS:-IgnoredHTTP=header}
  CHARON_LOG_LEVEL: ${CHARON_LOG_LEVEL:-info}
  CHARON_LOG_FORMAT: ${CHARON_LOG_FORMAT:-console}
  CHARON_P2P_EXTERNAL_HOSTNAME: ${CHARON_P2P_EXTERNAL_HOSTNAME:-} # Empty default required to avoid warnings.
  CHARON_P2P_RELAYS: ${CHARON_P2P_RELAYS:-http://relay:3640/enr}
  CHARON_P2P_TCP_ADDRESS: ${CHARON_P2P_TCP_ADDRESS:-0.0.0.0:3610}
  CHARON_VALIDATOR_API_ADDRESS: ${CHARON_VALIDATOR_API_ADDRESS:-0.0.0.0:3600}
  CHARON_MONITORING_ADDRESS: ${CHARON_MONITORING_ADDRESS:-0.0.0.0:3620}
  CHARON_JAEGER_ADDRESS: ${CHARON_JAEGER_ADDRESS-jaeger:6831} # Overriding to empty address allowed
  CHARON_NICKNAME: ${CHARON_NICKNAME:-}
  # sse_reorg_duties: refresh cached duties on beacon reorg events (mitigates
  # stale-duties AttesterNotInCommittee when the BN imports anchor blocks late).
  CHARON_FEATURE_SET_ENABLE: ${CHARON_FEATURE_SET_ENABLE:-sse_reorg_duties}
  # Platåberget (glamsterdam-devnet-8) custom network parameters. These make
  # charon compute signing domains for a devnet that it does not know by name.
  # Values taken from network-config/config.yaml.
  CHARON_TESTNET_NAME: ${CHARON_TESTNET_NAME:-plataberget}
  CHARON_TESTNET_FORK_VERSION: ${CHARON_TESTNET_FORK_VERSION:-0x10733183}
  CHARON_TESTNET_CHAIN_ID: ${CHARON_TESTNET_CHAIN_ID:-7091047534}
  CHARON_TESTNET_GENESIS_TIMESTAMP: ${CHARON_TESTNET_GENESIS_TIMESTAMP:-1786622400}
  CHARON_TESTNET_CAPELLA_HARD_FORK: ${CHARON_TESTNET_CAPELLA_HARD_FORK:-0x40733183}

services:
  #                 _   _
  #   __ _  ___ ___| |_| |__
  #  / _` |/ _ \_  / __| '_ \
  # | (_| |  __// /| |_| | | |
  #  \__, |\___/___|\__|_| |_|
  #  |___/
  # Execution layer: go-ethereum built for the devnet (consumes genesis.json).
  geth:
    image: ethpandaops/geth:${GETH_VERSION:-master}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/geth/run.sh"]
    ports:
      - ${GETH_PORT_P2P:-30303}:30303/tcp # P2P TCP
      - ${GETH_PORT_P2P:-30303}:30303/udp # P2P UDP
      - ${GETH_PORT_HTTP:-8545}:8545 # JSON-RPC
    networks: [cluster]
    volumes:
      - ./data/geth:/data
      - ./jwt:/opt/jwt
      - ./network-config:/network-config:ro
      - ./geth/run.sh:/opt/geth/run.sh:ro

  #  _ _       _     _   _
  # | (_) __ _| |__ | |_| |__   ___  _   _ ___  ___
  # | | |/ _` | '_ \| __| '_ \ / _ \| | | / __|/ _ \
  # | | | (_| | | | | |_| | | | (_) | |_| \__ \  __/
  # |_|_|\__, |_| |_|\__|_| |_|\___/ \__,_|___/\___|
  #      |___/
  # Consensus layer: lighthouse beacon node against the devnet testnet-dir.
  lighthouse:
    image: ethpandaops/lighthouse:${LIGHTHOUSE_VERSION:-unstable-4b1f3c2}
    entrypoint: ["/bin/sh", "/opt/lighthouse/bn-run.sh"]
    ports:
      - ${LIGHTHOUSE_PORT_P2P:-9000}:9000/tcp # P2P TCP
      - ${LIGHTHOUSE_PORT_P2P:-9000}:9000/udp # P2P UDP
      - ${LIGHTHOUSE_PORT_HTTP:-5052}:5052 # HTTP API
      - ${LIGHTHOUSE_PORT_METRICS:-5054}:5054 # Metrics
    networks: [cluster]
    volumes:
      - ./data/lighthouse:/opt/app/beacon
      - ./jwt:/opt/jwt
      - ./network-config:/network-config:ro
      - ./lighthouse/bn-run.sh:/opt/lighthouse/bn-run.sh:ro
    restart: unless-stopped
    depends_on: [geth]

  #       _                                  _ _            _
  #   ___| |__   __ _ _ __ ___  _ __     ___| (_) ___ _ __ | |_ ___
  #  / __| '_ \ / _` | '__/ _ \| '_ \   / __| | |/ _ \ '_ \| __/ __|
  # | (__| | | | (_| | | | (_) | | | | | (__| | |  __/ | | | |_\__ \
  #  \___|_| |_|\__,_|_|  \___/|_| |_|  \___|_|_|\___|_| |_|\__|___/
  node0:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node0/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node0/cluster-lock.json
      CHARON_JAEGER_SERVICE: node0
      CHARON_P2P_EXTERNAL_HOSTNAME: node0

  node1:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node1/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node1/cluster-lock.json
      CHARON_JAEGER_SERVICE: node1
      CHARON_P2P_EXTERNAL_HOSTNAME: node1

  node2:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node2/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node2/cluster-lock.json
      CHARON_JAEGER_SERVICE: node2
      CHARON_P2P_EXTERNAL_HOSTNAME: node2

  node3:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node3/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node3/cluster-lock.json
      CHARON_JAEGER_SERVICE: node3
      CHARON_P2P_EXTERNAL_HOSTNAME: node3

  node4:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node4/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node4/cluster-lock.json
      CHARON_JAEGER_SERVICE: node4
      CHARON_P2P_EXTERNAL_HOSTNAME: node4

  node5:
    <<: *node-base
    environment:
      <<: *node-env
      CHARON_PRIVATE_KEY_FILE: /opt/charon/.charon/cluster/node5/charon-enr-private-key
      CHARON_LOCK_FILE: /opt/charon/.charon/cluster/node5/cluster-lock.json
      CHARON_JAEGER_SERVICE: node5
      CHARON_P2P_EXTERNAL_HOSTNAME: node5

  relay:
    <<: *node-base
    command: relay
    depends_on: []
    environment:
      <<: *node-env
      CHARON_HTTP_ADDRESS: 0.0.0.0:3640
      CHARON_DATA_DIR: /opt/charon/relay
      CHARON_P2P_RELAYS: ""
      CHARON_P2P_EXTERNAL_HOSTNAME: relay
    volumes:
      - ./relay:/opt/charon/relay:rw

  #             _ _     _       _
  # __   ____ _| (_) __| | __ _| |_ ___  _ __ ___
  # \ \ / / _` | | |/ _` |/ _` | __/ _ \| '__/ __|
  #  \ V / (_| | | | (_| | (_| | || (_) | |  \__ \
  #   \_/ \__,_|_|_|\__,_|\__,_|\__\___/|_|  |___/
  # Each VC reads the charon-generated proposer-config.json from its node's
  # vc-config dir (written by charon next to the lock file) to set per-validator
  # fee recipient / gas limit / builder participation. See <client>/run.sh.
  vc0-lighthouse:
    build:
      context: ./lighthouse
      args:
        VERSION: ${LIGHTHOUSE_VERSION:-unstable-4b1f3c2}
    image: cdvc-lighthouse-vc:${LIGHTHOUSE_VERSION:-unstable-4b1f3c2}
    networks: [cluster]
    depends_on: [node0]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node0:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    volumes:
      - ./lighthouse/run.sh:/opt/lighthouse/run.sh
      - ./network-config:/network-config:ro
      - .charon/cluster/node0/validator_keys:/opt/charon/validator_keys
      - .charon/cluster/node0/vc-config:/opt/charon/vc-config:ro

  vc1-teku:
    build:
      context: ./teku
      args:
        VERSION: ${TEKU_VERSION:-master}
    image: cdvc-teku-vc:${TEKU_VERSION:-master}
    networks: [cluster]
    depends_on: [node1]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node1:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    volumes:
      - ./teku/run.sh:/opt/teku/run.sh
      - .charon/cluster/node1/validator_keys:/opt/charon/validator_keys
      - .charon/cluster/node1/vc-config:/opt/charon/vc-config:ro

  vc2-nimbus:
    build:
      context: ./nimbus
      args:
        BN_VERSION: ${NIMBUS_BN_VERSION:-unstable}
        VC_VERSION: ${NIMBUS_VC_VERSION:-multiarch-v26.8.0}
    image: cdvc-nimbus-vc:${NIMBUS_VC_VERSION:-multiarch-v26.8.0}
    user: "0:0" # ethpandaops beacon data is root-owned; the statusim VC runs as uid 1000.
    networks: [cluster]
    depends_on: [node2]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node2:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    volumes:
      - ./nimbus/run.sh:/opt/nimbus/run.sh:ro
      - .charon/cluster/node2/validator_keys:/home/validator_keys
      - .charon/cluster/node2/vc-config:/home/charon/vc-config:ro

  vc3-prysm:
    build:
      context: ./prysm
      args:
        VERSION: ${PRYSM_VERSION:-glamsterdam-devnet-8}
    image: cdvc-prysm-vc:${PRYSM_VERSION:-glamsterdam-devnet-8}
    entrypoint: ["/bin/bash", "/home/prysm/run.sh"]
    networks: [cluster]
    depends_on: [node3]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node3:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
    volumes:
      - ./prysm/run.sh:/home/prysm/run.sh:ro
      - ./network-config:/network-config:ro
      - .charon/cluster/node3/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node3/vc-config:/home/charon/vc-config:ro

  vc4-lodestar: &vc-lodestar
    image: ethpandaops/lodestar:${LODESTAR_VERSION:-glamsterdam-devnet-8}
    entrypoint: ["/bin/sh", "/opt/lodestar/run.sh"]
    networks: [cluster]
    depends_on: [node4]
    restart: unless-stopped
    environment:
      BEACON_NODE_ADDRESS: http://node4:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      BUILDER_SELECTION: ${BUILDER_SELECTION:-builderalways}
    volumes:
      - ./lodestar/run.sh:/opt/lodestar/run.sh:ro
      - ./network-config:/network-config:ro
      - .charon/cluster/node4/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node4/vc-config:/home/charon/vc-config:ro

  vc5-lodestar:
    <<: *vc-lodestar
    depends_on: [node5]
    environment:
      BEACON_NODE_ADDRESS: http://node5:3600
      BUILDER_API_ENABLED: ${BUILDER_API_ENABLED:-true}
      BUILDER_SELECTION: ${BUILDER_SELECTION:-builderalways}
    volumes:
      - ./lodestar/run.sh:/opt/lodestar/run.sh:ro
      - ./network-config:/network-config:ro
      - .charon/cluster/node5/validator_keys:/home/charon/validator_keys
      - .charon/cluster/node5/vc-config:/home/charon/vc-config:ro

  #                        _ _             _
  #  _ __ ___   ___  _ __ (_) |_ ___  _ __(_)_ __   __ _
  # | '_ ` _ \ / _ \| '_ \| | __/ _ \| '__| | '_ \ / _` |
  # | | | | | | (_) | | | | | || (_) | |  | | | | | (_| |
  # |_| |_| |_|\___/|_| |_|_|\__\___/|_|  |_|_| |_|\__, |
  #                                                |___/
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.14.0}
    ports:
      - "9090:9090"
    networks: [cluster]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.0}
    ports:
      - "3000:3000"
    networks: [cluster]
    depends_on: [prometheus]
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/datasource.yml
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/dashboards:/etc/dashboards

networks:
  cluster:
